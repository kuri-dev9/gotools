# gxfer ACTION Config example
# run executes every job in READ -> WRITE -> REMOVE order.
# monitor watches every job registered in READ.

[ACTION]
READ=SNMP,CSV_DOWNLOAD
WRITE=REPORT_UPLOAD
REMOVE=OLD_FILE_REMOVE

[DEFAULT_READ]
PROTOCOL=FTP
VAULT=True
FTP_PASSIVE=False             # False=Active, True=Passive
USE_REGULAR_EXPRESSION=True
REMOVE=False
DOWNLOAD_MODE=skip-write
FETCH_INTERVAL=5              # Remote list polling interval in seconds
TIMEOUT=10                    # Connection timeout; also FTP I/O idle timeout
OFFSET=0

[SNMP]
VAULT_HOSTNAME=SDNEIS
VAULT_USER=ispgw
SRC_DIR=/user/ispgw
SRC_FILE_PATTERN=ix_iftable_%Y%m%d%H%M.csv
DST_DIR=/DATA/SDNEIS/data/IX/snmp
DST_FILE_PATTERN=ix_iftable_%Y%m%d%H%M.csv

[CSV_DOWNLOAD]
# Direct connection uses HOSTNAME and USER.
VAULT=False
PROTOCOL=SFTP
HOSTNAME=sftp.example.com
PORT=22
USER=transfer
# PW is intentionally omitted. A hidden terminal prompt is used.
SRC_DIR=/data/incoming
SRC_FILE_PATTERN=*.csv
DST_DIR=./download
DST_FILE_PATTERN=*.csv

[DEFAULT_WRITE]
PROTOCOL=SFTP
VAULT=False
HOSTNAME=sftp.example.com
PORT=22
USER=transfer
SRC_DIR=./upload
SRC_FILE_PATTERN=*.csv
DST_DIR=/data/outgoing
DST_FILE_PATTERN=*.csv
USE_REGULAR_EXPRESSION=False
REMOVE=False

[REPORT_UPLOAD]

[DEFAULT_REMOVE]
PROTOCOL=FTP
VAULT=True
FTP_PASSIVE=False
VAULT_HOSTNAME=SDNEIS
VAULT_USER=ispgw
SRC_DIR=/user/ispgw/archive
SRC_FILE_PATTERN=*.tmp
USE_REGULAR_EXPRESSION=False

[OLD_FILE_REMOVE]
